spring.application.name=trending-news-alerts
server.port=${PORT:8080}

# Polling — first poll fires `initialDelayAfterBaselineSeconds` after the
# baseline sweep finishes, then every `intervalMinutes` thereafter.
trending.poll.intervalMinutes=15
trending.poll.initialDelayAfterBaselineSeconds=60
# A topic must appear in feeds from at least this many different countries.
trending.minCountries=2
trending.maxTopicsTracked=500

# Comma-separated RSS feeds, each as: source name|country|url
trending.feeds=BBC|UK|http://feeds.bbci.co.uk/news/rss.xml,\
  Guardian|UK|https://www.theguardian.com/world/rss,\
  SkyNews|UK|http://feeds.skynews.com/feeds/rss/home.xml,\
  NPR|US|https://feeds.npr.org/1001/rss.xml,\
  CBS|US|https://www.cbsnews.com/latest/rss/main,\
  NYTWorld|US|https://rss.nytimes.com/services/xml/rss/nyt/World.xml,\
  CNBC|US|https://www.cnbc.com/id/100003114/device/rss/rss.html,\
  AlJazeera|Qatar|https://www.aljazeera.com/xml/rss/all.xml,\
  ABCAustralia|Australia|https://www.abc.net.au/news/feed/51120/rss.xml,\
  DW|Germany|https://rss.dw.com/rdf/rss-en-all,\
  France24|France|https://www.france24.com/en/rss

# Resend email (HTTP API — reliable from Railway, unlike SMTP)
resend.apiKey=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Trending Alerts <onboarding@resend.dev>}
alert.recipient=${ALERT_RECIPIENT:}

# Logging
logging.level.com.example.trending=INFO
