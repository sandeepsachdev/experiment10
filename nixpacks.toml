# Hints for Railway's Nixpacks builder.
# Maven + Java 17 are detected automatically from pom.xml, but pinning here
# avoids surprises if Nixpacks defaults change.

[phases.setup]
nixPkgs = ["maven", "jdk17"]

[phases.build]
cmds = ["mvn -B -DskipTests package"]

[start]
cmd = "java -jar target/trending-news-alerts-0.0.1-SNAPSHOT.jar"
